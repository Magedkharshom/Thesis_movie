   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(256.312906 203.587515)">Woody, Buzz, and the rest of Andy's toys haven't been played with in years. With Andy about to go to college, the gang</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(256.312906 214.637515)">find themselves accidentally left at a nefarious day care center. The toys must band together to escape and return</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(256.312906 225.687515)">home to Andy.</text>
   </g>
