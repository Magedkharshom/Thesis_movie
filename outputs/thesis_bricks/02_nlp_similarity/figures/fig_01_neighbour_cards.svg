   <g id="text_14">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(256.312906 452.138125)">Brought together by their shared love of music, ten years on Liam and Natalie are at breaking point. In their case</text>
