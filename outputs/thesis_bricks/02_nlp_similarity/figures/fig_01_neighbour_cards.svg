   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(256.312906 286.437718)">The film follows the story of two couples in crisis who are about to break up but who, due to the Lockdown, imposed to</text>
