   </g>
   <g id="text_21">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(256.312906 534.988329)">Bernie and Joan are two fiery flirters who are passionate about everything from hookups to breakups and each other.</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(256.312906 546.038329)">When he sets up his best friend, Danny, with her roommate, Debbie, the sparks soon fly as they try to navigate the</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(256.312906 557.088329)">relationship minefields from the bar to the bedroom…</text>
   </g>
